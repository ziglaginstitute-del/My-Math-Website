services:
  - type: web
    name: ziglag-math-portal
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.2"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: MAIL_USERNAME
        value: "ziglaginstitute@gmail.com"
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        value: "ziglaginstitute@gmail.com"
      - key: ADMIN_EMAIL
        value: "ziglaginstitute@gmail.com"
