<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=https://cbt-jamb-website-ziglaginstitute-8370s-projects.vercel.app">
  <title>PrepCBT Examination Portal - Ziglag Institute</title>
  <link rel="icon" type="image/png" href="ZIG logo transparent.png">
  <script>
    (function () {
      var target = "https://cbt-jamb-website-ziglaginstitute-8370s-projects.vercel.app";
      var search = window.location.search || "";
      var hash = window.location.hash || "";
      window.location.replace(target + search + hash);
    })();
  </script>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #111827;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #0284c7;
      --primary-hover: #0369a1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 1.5rem;
    }
    .redirect-card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-badge {
      width: 64px;
      height: 64px;
      margin-bottom: 1.5rem;
      object-fit: contain;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.5rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 1.5rem 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: var(--primary);
      color: #ffffff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background 0.2s, transform 0.1s;
    }
    .cta-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <img src="ZIG logo transparent.png" alt="Ziglag Logo" class="logo-badge" onerror="this.style.display='none'">
    <div class="spinner"></div>
    <h1>Launching PrepCBT Portal</h1>
    <p>Connecting you to the live JAMB UTME & WASSCE Computer-Based Testing examination hall...</p>
    <a href="https://cbt-jamb-website-ziglaginstitute-8370s-projects.vercel.app" class="cta-btn">
      Enter CBT Examination Hall ➜
    </a>
  </div>
</body>
</html>
